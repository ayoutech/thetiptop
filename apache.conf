<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # --- En-têtes de sécurité ---
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # Render termine le TLS : le HTTPS est signalé par X-Forwarded-Proto
    SetEnvIf X-Forwarded-Proto "^https$" IS_HTTPS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=IS_HTTPS
    # Cookie de session : drapeau Secure ajouté sur les réponses 2xx ET sur les redirections/erreurs
    Header edit Set-Cookie ^(.*)$ "$1; Secure" env=IS_HTTPS
    Header always edit Set-Cookie ^(.*)$ "$1; Secure" env=IS_HTTPS

    # Marqueur de version : commit déployé par Render (variable fournie par la plateforme).
    # Utilisé par ci/smoke-test.sh pour savoir QUELLE version répond (et non l'ancienne instance).
    PassEnv RENDER_GIT_COMMIT
    Header always set X-Release "%{RENDER_GIT_COMMIT}e" env=RENDER_GIT_COMMIT

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
