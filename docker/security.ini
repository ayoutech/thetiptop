; Durcissement PHP (copié dans conf.d par le Dockerfile)
expose_php = Off
display_errors = Off
; Tampon de sortie : permet les redirections header('Location') après l'inclusion du header HTML
output_buffering = 4096
log_errors = On
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
